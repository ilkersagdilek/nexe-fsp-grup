<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NEXE FSP — Grup Hazırlayıcı</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="theme-color" content="#1B2C48">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px;}
.app{background:#1B2C48;border-radius:14px;overflow:hidden;width:100%;max-width:560px;box-shadow:0 4px 24px rgba(0,0,0,0.18);}
.app-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(42,183,177,0.2);}
.app-header img{width:36px;height:36px;border-radius:8px;}
.app-header-title{font-size:15px;font-weight:600;color:#FFFFF0;}
.app-header-sub{font-size:11px;color:rgba(255,255,240,0.45);margin-top:2px;}
.tab-bar{display:flex;padding:0 20px;border-bottom:1px solid rgba(42,183,177,0.15);}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:12px 16px;font-size:13px;font-weight:500;color:rgba(255,255,240,0.45);cursor:pointer;}
.tab-btn.active{color:#2AB7B1;border-bottom:2px solid #2AB7B1;}
.body{background:#FFFFF0;padding:20px;}
.sec{display:none;}.sec.active{display:block;}
.dz{border:1.5px dashed rgba(42,183,177,0.4);border-radius:10px;padding:24px;text-align:center;cursor:pointer;margin-bottom:16px;}
.dz:hover{border-color:#2AB7B1;background:rgba(42,183,177,0.05);}
.dz p{color:#1B2C48;font-size:14px;margin:6px 0 0;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.sc{background:#1B2C48;border-radius:8px;padding:12px;text-align:center;}
.sc-n{font-size:22px;font-weight:600;color:#2AB7B1;}
.sc-l{font-size:11px;color:rgba(255,255,240,0.55);margin-top:4px;}
.info{background:rgba(107,91,149,0.1);border:0.5px solid rgba(107,91,149,0.25);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#6B5B95;line-height:1.5;}
.pc{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:0.5px solid rgba(27,44,72,0.1);border-radius:8px;margin-bottom:6px;background:white;}
.pn{font-size:12px;color:rgba(27,44,72,0.3);min-width:20px;}
.pm{font-size:14px;font-weight:500;color:#1B2C48;}
.pt{font-size:12px;color:rgba(27,44,72,0.45);font-family:monospace;margin-top:2px;}
.bc{font-size:12px;padding:5px 12px;background:transparent;border:0.5px solid rgba(42,183,177,0.4);color:#2AB7B1;border-radius:6px;cursor:pointer;white-space:nowrap;}
.bc:hover{background:rgba(42,183,177,0.08);}
.bc.ok{color:#1a9e97;border-color:#1a9e97;}
.lbl{font-size:13px;font-weight:500;color:#1B2C48;margin-bottom:8px;}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.bs{font-size:12px;padding:4px 10px;background:transparent;border:0.5px solid rgba(27,44,72,0.18);color:#1B2C48;border-radius:6px;cursor:pointer;}
textarea{width:100%;font-size:13px;line-height:1.6;background:white;border:0.5px solid rgba(27,44,72,0.12);border-radius:8px;padding:10px;resize:vertical;color:#1B2C48;font-family:inherit;}
.ba{font-size:13px;padding:9px 20px;background:#2AB7B1;border:none;color:#1B2C48;font-weight:600;border-radius:8px;cursor:pointer;}
.ba:hover{background:#24a39e;}
.ai{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:0.5px solid rgba(27,44,72,0.1);border-radius:8px;margin-bottom:8px;cursor:pointer;background:white;}
.ai:hover{border-color:#2AB7B1;}
.at{font-size:14px;font-weight:500;color:#1B2C48;}
.am{font-size:12px;color:rgba(27,44,72,0.45);margin-top:3px;}
.emp{font-size:14px;color:rgba(27,44,72,0.35);text-align:center;padding:2rem 0;}
.toast{background:#1B2C48;color:#2AB7B1;border:0.5px solid #2AB7B1;padding:8px 16px;border-radius:8px;font-size:13px;text-align:center;margin-top:12px;display:none;}
.bclose{font-size:12px;padding:4px 10px;background:transparent;border:0.5px solid rgba(107,91,149,0.3);color:#6B5B95;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <img src="/logo.png" alt="NEXE">
    <div>
      <div class="app-header-title">NEXE FSP — Grup Hazırlayıcı</div>
      <div class="app-header-sub">Haftalık sunum katılımcı yönetimi</div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('bh',this)">Bu hafta</button>
    <button class="tab-btn" onclick="showTab('ar',this)">Arşiv</button>
  </div>
  <div class="body">
    <div id="bh" class="sec active">
      <div class="dz" id="dz" onclick="document.getElementById('fi').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2AB7B1" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>CSV dosyasını buraya sürükle veya tıkla</p>
        <input type="file" id="fi" accept=".csv" style="display:none">
      </div>
      <div id="res" style="display:none;">
        <div class="stats" id="stats"></div>
        <div class="info">WhatsApp → Yeni grup → Üye ekle → Arama kutusuna yapıştır → seç → sonraki kişiye geç</div>
        <div id="cards" style="margin-bottom:16px;"></div>
        <div style="margin-bottom:16px;">
          <div class="hrow"><p class="lbl">Davet mesajı</p><button class="bs" onclick="cp('msg')">Kopyala</button></div>
          <textarea id="msg" rows="10"></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="ba" onclick="arch()">Arşive gönder</button>
        </div>
      </div>
    </div>
    <div id="ar" class="sec">
      <div id="al"></div>
      <div id="ad" style="display:none;margin-top:12px;"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
const DAVET=`Herkese Merhaba

Lütfen sunuma katılmadan önce mümkünse dikkatinizi verebileceğiniz bir 15 dakika ayırarak tanıtım videomuzu izleyiniz!

Sunumu videoda ana hatlarıyla aktarılan program çerçevesinde soru cevap etkinliği olarak gerçekleştireceğiz.

https://nexevita.com/tanitim

Tıp Doktorları, Diş Hekimleri ve Eczacılar için Almanya'da devlet destekli FSP Programı konusunda yarın akşam saat 21:00'de başlayacak olan toplantıdan önce Zoom bağlantısını yine bu gruptan paylaşacağız.

Yarın akşam görüşmek üzere.`;

const KEY='nexe_fsp_arsiv';
let cR=[],cF='';
function showTab(id,btn){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');if(id==='ar')renderAr();}
const dz=document.getElementById('dz'),fi=document.getElementById('fi');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='#2AB7B1';});
dz.addEventListener('dragleave',()=>dz.style.borderColor='');
dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='';const f=e.dataTransfer.files[0];if(f)load(f);});
fi.addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0]);});
function load(f){cF=f.name;const r=new FileReader();r.onload=e=>parse(e.target.result);r.readAsText(f,'UTF-8');}
function ct(t){return t.replace(/\s/g,'').replace(/^00/,'+');}
function parse(txt){
  const lines=txt.trim().split('\n');
  const h=lines[0].split(',').map(x=>x.trim().replace(/^\uFEFF/,''));
  const ii=h.findIndex(x=>x.toLowerCase().includes('isim')||x.toLowerCase().includes('ad'));
  const it=h.findIndex(x=>x.toLowerCase().includes('telefon')||x.toLowerCase().includes('tel'));
  const im=h.findIndex(x=>x.toLowerCase().includes('meslek'));
  cR=lines.slice(1).map(l=>{const c=l.split(',').map(x=>x.trim());return{isim:c[ii]||'',tel:ct(c[it]||''),meslek:c[im]||''};}).filter(r=>r.tel&&r.tel.length>5);
  const tip=cR.filter(r=>r.meslek.toLowerCase().includes('t\u0131p')||r.meslek.toLowerCase().includes('tip')).length;
  const dis=cR.filter(r=>r.meslek.toLowerCase().includes('di\u015f')||r.meslek.toLowerCase().includes('dis')).length;
  const ecz=cR.filter(r=>r.meslek.toLowerCase().includes('ecz')).length;
  document.getElementById('stats').innerHTML=`<div class="sc"><p class="sc-n">${cR.length}</p><p class="sc-l">Toplam kayıt</p></div><div class="sc"><p class="sc-n">${tip}</p><p class="sc-l">Tıp doktoru</p></div><div class="sc"><p class="sc-n">${dis+ecz}</p><p class="sc-l">Diş hek. / Ecz.</p></div>`;
  document.getElementById('cards').innerHTML=`<p class="lbl" style="margin-bottom:10px;">Katılımcılar — sırayla kopyala (${cR.length} kişi)</p>`+cR.map((r,i)=>`<div class="pc"><div style="display:flex;align-items:center;gap:10px;"><span class="pn">${i+1}</span><div><p class="pm">${r.isim}</p><p class="pt">${r.tel}</p></div></div><button class="bc" onclick="cs('${r.tel}',this)">Kopyala</button></div>`).join('');
  document.getElementById('msg').value=DAVET;
  document.getElementById('res').style.display='block';
  dz.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2AB7B1" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><p style="color:#2AB7B1;margin:6px 0 0;">${cR.length} kayıt yüklendi</p><p style="font-size:12px;color:rgba(27,44,72,0.4);margin:3px 0 0;">Yeni dosya için tıkla</p><input type="file" id="fi2" accept=".csv" style="display:none">`;
  document.getElementById('fi2').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0]);});
  dz.onclick=()=>document.getElementById('fi2').click();
}
function arch(){
  if(!cR.length)return;
  const ar=JSON.parse(localStorage.getItem(KEY)||'[]');
  ar.unshift({tarih:new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}),dosya:cF,rows:cR});
  localStorage.setItem(KEY,JSON.stringify(ar));
  toast('Arşive gönderildi!');cR=[];
  document.getElementById('res').style.display='none';
  dz.innerHTML=`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2AB7B1" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><p>CSV dosyasını buraya sürükle veya tıkla</p><input type="file" id="fi3" accept=".csv" style="display:none">`;
  document.getElementById('fi3').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0]);});
  dz.onclick=()=>document.getElementById('fi3').click();
}
function renderAr(){
  const ar=JSON.parse(localStorage.getItem(KEY)||'[]');
  document.getElementById('ad').style.display='none';
  if(!ar.length){document.getElementById('al').innerHTML='<p class="emp">Henüz arşivlenmiş sunum yok.</p>';return;}
  document.getElementById('al').innerHTML=ar.map((a,i)=>{
    const tip=a.rows.filter(r=>r.meslek.toLowerCase().includes('t\u0131p')||r.meslek.toLowerCase().includes('tip')).length;
    const dis=a.rows.filter(r=>r.meslek.toLowerCase().includes('di\u015f')||r.meslek.toLowerCase().includes('dis')).length;
    const ecz=a.rows.filter(r=>r.meslek.toLowerCase().includes('ecz')).length;
    return`<div class="ai" onclick="showD(${i})"><div><p class="at">${a.tarih} sunumu</p><p class="am">${a.rows.length} katılımcı · ${tip} tıp · ${dis} diş · ${ecz} ecz.</p></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(27,44,72,0.25)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>`;
  }).join('');
}
function showD(i){
  const a=JSON.parse(localStorage.getItem(KEY)||'[]')[i];
  const d=document.getElementById('ad');d.style.display='block';
  d.innerHTML=`<div class="hrow" style="margin-bottom:12px;"><p style="font-size:14px;font-weight:500;color:#1B2C48;">${a.tarih} — ${a.rows.length} katılımcı</p><button class="bclose" onclick="document.getElementById('ad').style.display='none'">Kapat</button></div>`+a.rows.map((r,i)=>`<div class="pc"><div style="display:flex;align-items:center;gap:10px;"><span class="pn">${i+1}</span><div><p class="pm">${r.isim}</p><p class="pt">${r.tel}</p></div></div><button class="bc" onclick="cs('${r.tel}',this)">Kopyala</button></div>`).join('');
}
function cs(tel,btn){navigator.clipboard.writeText(tel).then(()=>{const o=btn.textContent;btn.textContent='Kopyalandı!';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},1200);});}
function cp(id){navigator.clipboard.writeText(document.getElementById(id).value).then(()=>toast('Kopyalandı!'));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800);}
</script>
</body>
</html>
